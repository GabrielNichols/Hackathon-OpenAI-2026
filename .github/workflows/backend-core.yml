name: backend-core

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/contracts/**"
      - ".github/workflows/backend-core.yml"
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: core_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d core_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      CORE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/core_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - run: python -m ruff format --check app tests migrations
      - run: python -m ruff check app tests migrations
      - run: python -m mypy app
      - run: python -m pytest -s tests/unit tests/contract -q
      - run: python -m pytest -s -m postgres tests/integration/core -q
